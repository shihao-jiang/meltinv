[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meltinv"
version = "0.1.0"
description = "Joint inversion of melt pressure, lithospheric thickness and source enrichment from REE data."
authors = [{ name = "Shihao Jiang" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<1.27",
  "scipy>=1.8,<1.14",
  "pandas>=2.0,<2.2",
  "openpyxl",
  "matplotlib==3.9.2",
  "meltPT @ git+https://github.com/shihao-jiang/meltPT_fixed.git"
]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=7"]
tutorials = ["jupyterlab"]
# the web app in app/; pyarrow 20 and later need NumPy 2
app = ["streamlit>=1.66,<2", "pyarrow<20"]

[project.scripts]
meltinv = "meltinv.cli:main"

[tool.setuptools.packages.find]
include = ["meltinv*"]

[tool.setuptools.package-data]
"meltinv" = ["data/*.npy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs meltPT and takes about a minute (run with: pytest -m slow)"]
# deprecation warnings raised inside third-party libraries, not by meltinv
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*", "ignore::DeprecationWarning:pyparsing.*"]
